# Zentrale Konfiguration fuer das Gebotsmodell (kickbase_tool/bidding/).
#
# Alle Werte hier sind frei anpassbar, ohne Code aendern zu muessen -- fehlt
# ein Schluessel oder die ganze Datei, greifen die Defaults aus
# kickbase_tool/bidding/config.py (DEFAULTS), das Modell stuerzt also nie ab.
#
# Diese Datei enthaelt bewusst die STARTWERTE (identisch zu den Python-Defaults);
# Sinn und Zweck ist, dass du hier direkt anpassen kannst, sobald du siehst,
# wie sich das Modell in deiner Liga verhaelt, ohne Python-Code zu beruehren.

# Wie stark jeder Faktor in den 0..1 Attraktivitaets-Score einfliesst
# (kickbase_tool/bidding/scoring.py). Explizite Nutzervorgabe, NICHT gleich
# gewichtet: Kauf-Rang bildet den langfristigen sportlichen Gesamtwert am
# besten ab (35%), Startchance ist fuer tatsaechliche Punkte am wichtigsten
# (30%), PKT/MIO-Effizienz zaehlt fuer die Kaderoptimierung (20%), MW-Trend
# beeinflusst Overpay/Tradingwert am wenigsten (15%). Summe = 1.0. KEIN
# zusaetzlicher marktwertabhaengiger Fade auf PKT/MIO mehr -- das waere eine
# doppelte Marktwert-Beruecksichtigung (die MW-Abhaengigkeit steckt schon in
# den PPM-Schwellen selbst, siehe ppm_thresholds_for/PPM_TIERS).
attractiveness:
  rank_tier_weight: 0.35
  start_probability_weight: 0.30
  ppm_efficiency_weight: 0.20
  market_value_trend_weight: 0.15

# Rang-Baender, explizite Nutzervorgabe (feiner gestuft als zuvor, vor allem
# im Mittelfeld 141-250). "max_rank: null" = offenes Ende (schlechtester Tier).
rank_tiers:
  - { max_rank: 20, score: 1.00 }
  - { max_rank: 50, score: 0.85 }
  - { max_rank: 90, score: 0.70 }
  - { max_rank: 140, score: 0.55 }
  - { max_rank: 200, score: 0.35 }
  - { max_rank: 250, score: 0.20 }
  - { max_rank: null, score: 0.05 }

# Score je Startwahrscheinlichkeits-Kategorie (Kickbase-Code 1=Sicher..5=Ausgeschlossen),
# explizite Nutzervorgabe. "Ausgeschlossen" bewusst > 0 -- bedeutet nicht
# automatisch 0 Einsatzminuten, er kann trotzdem eingewechselt werden.
start_probability_score:
  "1": 1.00  # Sicher
  "2": 0.80  # Erwartet
  "3": 0.55  # Unsicher
  "4": 0.30  # Unwahrscheinlich
  "5": 0.10  # Ausgeschlossen
  none: 0.50 # unbekannt (z.B. Datenausfall) -- neutral statt bestrafend

# Score-Schwellen (auf dem finalen 0..1 Attraktivitaets-Score) fuer die vier
# Gebotskategorien. Alles darunter faellt in die naechstniedrigere Kategorie,
# unterhalb von ueber_marktwert = MARKTWERT (evtl. sogar "kein Gebot").
category_thresholds:
  all_in: 0.80
  will_haben: 0.62
  ueber_marktwert: 0.37

# Harte Deckelung: Unwahrscheinlich/Ausgeschlossen duerfen die Kategorie nicht
# allein durch starken MW-Trend/guten Rang bis WILL-ICH-HABEN oder ALL-IN
# heben (siehe Reggiani-Beispiel: Ausgeschlossen -> maximal ueber_marktwert).
start_probability_category_cap:
  "4": ueber_marktwert
  "5": ueber_marktwert

# Cold-Start-Overpay-Spannen (%) je Kategorie -- werden benutzt, solange zu
# wenig echte, aehnliche Ligatransfers vorliegen (siehe pricing.py). Mit
# wachsendem Transfer-Log verschiebt sich die Gewichtung automatisch in
# Richtung der echten, empirisch aus deiner Liga kalibrierten Werte.
cold_start_overpay_pct:
  all_in: { low: 10.0, mid: 16.0, high: 25.0 }
  will_haben: { low: 6.0, mid: 10.0, high: 16.0 }
  ueber_marktwert: { low: 1.0, mid: 4.0, high: 8.0 }
  marktwert: { low: -4.0, mid: -1.0, high: 2.0 }

# Unterhalb dieses Attraktivitaets-Scores UND wenn auch der kalibrierte
# Overpay nicht klar positiv ist, empfiehlt die Spalte "kein Gebot" statt
# einer Zahl.
no_bid_score_threshold: 0.30
no_bid_overpay_pct_threshold: 1.0

# Zweite Sicherheitspruefung (pricing.py): wie gut ist die PKT/MIO-Effizienz
# noch, wenn man tatsaechlich das empfohlene Gebot statt des Marktwerts
# bezahlt? Bei ALL-IN-Spielern darf die normale Mindestschwelle
# (ppm_thresholds_for) um diesen Faktor unterschritten werden, weil absolute
# Punkte und begrenzte Startelfplaetze bei absoluten Elite-Spielern einen
# eigenen Wert haben.
elite_ppm_min_relaxation: 0.85

# "Vergleichbar" (similarity.py) ist ein GEWICHTETER, kontinuierlicher
# Similarity-Score (0..1) ueber mehrere Dimensionen -- kein binaeres
# Marktwertfenster/Positions-Kriterium mehr (explizite Nutzervorgabe: "keine
# groben Vergleichsgruppen mehr, Distanz statt Kategorien"). Gewichte:
# Startchance bildet ab, wie sicher der Spieler DAMALS spielte (25%),
# Kauf-Rang die sportliche Gesamtattraktivitaet (20% -- kauf_rank enthaelt
# bereits Form/Gegner/Restprogramm, siehe ranking/scoring.py, "Teamstaerke"
# unten ist daher bewusst klein, keine Doppelgewichtung), Marktwert-Klasse
# (20%, log-skaliert: 9 vs. 11 Mio. naeher als 9 vs. 25 Mio.), MW-Trend (15%,
# reuse scoring.market_value_trend_score), PPM-Effizienz (10%, reuse
# scoring.ppm_score), erwartete Performance (5%, season_avg) und
# Teamstaerke/Rolle (5%, team_form). Summe = 1.0.
similarity_weights:
  start_probability: 0.25
  rank_tier: 0.20
  market_value: 0.20
  market_value_trend: 0.15
  ppm_efficiency: 0.10
  expected_performance: 0.05
  team_strength: 0.05

# Mindest-Similarity (0..1, siehe similarity.similarity_score), unterhalb
# derer ein historischer Transfer NICHT als Vergleich zaehlt -- verhindert,
# dass bei wenigen Kandidaten schlechte Vergleiche "aufgefuellt" werden, nur
# um eine Mindestanzahl zu erreichen. Startwert, zur Kalibrierung anhand
# echter Ligadaten siehe backtest.py.
similarity_min_score: 0.55

# Harte Ausschlusskriterien (similarity.py), ZUSAETZLICH zur Distanz oben --
# manche Unterschiede sind so fundamental, dass kein Gewicht sie aufwiegen
# darf (explizite Nutzervorgabe).
similarity_hard_cutoffs:
  # Sicher/Erwartet (1/2) darf nie mit Unwahrscheinlich/Ausgeschlossen (4/5)
  # verglichen werden, unabhaengig von allen anderen Dimensionen.
  exclude_start_probability_bucket_clash: true
  # Maximales Marktwert-Verhaeltnis (Prozent des kleineren MW) je
  # Marktwertklasse (market_value_classes) -- deutlich weiter gefasst als die
  # fruehere similarity_mv_window_pct, weil hier nur noch die absolute
  # Notbremse gezogen wird; die eigentliche Feinabstufung passiert ueber die
  # kontinuierliche market_value-Distanz oben.
  max_market_value_ratio_pct: [40, 50, 60, 75, 100, 120, 150, 200]
  # MW-Trend-Score (0..1, 0.5=flach) gilt oberhalb/unterhalb dieser Schwellen
  # als "stark steigend"/"stark fallend" -- ein stark steigender und ein
  # stark fallender Spieler duerfen sich nicht als Hauptvergleich dienen.
  trend_polarity_high: 0.75
  trend_polarity_low: 0.25
  # Ein langfristig verletzter Spieler (Status "verletzt"/"Reha") darf nicht
  # mit einem fitten Spieler verglichen werden (und umgekehrt).
  exclude_injury_mismatch: true

# Ziel-/Obergrenze fuer die Anzahl beruecksichtigter Vergleichstransfers
# (similarity.py): es werden bis zu max_k der aehnlichsten Transfers oberhalb
# similarity_min_score verwendet -- NICHT zwangsweise aufgefuellt, wenn
# weniger vorhanden sind (siehe Aufgabenstellung "10-20, wenn nur 7 gut sind,
# dann 7"). target_n ist der Nenner der Confidence-Berechnung
# (pricing._confidence): bei max_k erreichten, validen Vergleichen ist das
# Vertrauen "voll eingeschwungen".
similar_transfers_target_n: 20
similar_transfers_max_k: 20

# Halbwertszeit (Tage) fuer die Aktualitaets-Gewichtung eines Transfers
# (stats.decay_weight) -- ersetzt die fruehere Stufenfunktion durch eine
# kontinuierliche Kurve (explizite Nutzervorgabe: "keine starren Stufen,
# sondern Halbwertszeit"). Bei 30 Tagen hat ein 30 Tage alter Transfer noch
# 50% Gewicht, ein 60 Tage alter noch 25%, usw.
recency_half_life_days: 30.0

# Wenn ein Transfer laut Activity-Feed OHNE Konkurrenzgebot ("coc"/bid_count
# == 0) gewonnen wurde, ist der gezahlte Preis eher ein unkontrollierter
# Angebotspreis als ein echtes Wettbewerbsergebnis -- Kickbase liefert keine
# Gebotshoehen, nur die Anzahl der Gebote, ein echtes "zweithoechstes Gebot"
# ist also nicht verfuegbar (siehe transfers.py-Docstring). Solche Transfers
# fliessen mit reduziertem statt vollem Gewicht ein.
bid_count_no_competition_weight: 0.85

# Ziel-Perzentil der (similarity- und zeitgewichteten) historischen
# Overpay-Verteilung je Attraktivitaetskategorie -- ersetzt den fruehen
# linearen Cold-Start-Blend (siehe pricing.py). Startwerte aus der
# Aufgabenstellung (⚪~50., 🟢~60-65., ⭐~75-80., 🔥~85-90., hier als
# Punktwerte), zur Kalibrierung anhand echter Ligadaten siehe backtest.py.
category_target_percentile:
  marktwert: 50
  ueber_marktwert: 62
  will_haben: 77
  all_in: 87

# Transfers, die erst NACH dem eigentlichen Transfer-Zeitpunkt entdeckt wurden
# (z.B. beim allerersten Import der ganzen Saison-Historie) und deshalb mit
# dem Marktwert/Rang von HEUTE statt vom echten Transfer-Tag angereichert
# werden mussten, zaehlen mit reduziertem Gewicht -- daempft Look-ahead-Bias,
# ohne die Daten komplett zu verwerfen.
backfilled_weight_factor: 0.6

# Wie stark der Liga-Markt-Faktor (aktuelle Liga-weite Preisaggressivitaet)
# den finalen Overpay zusaetzlich verschieben darf (Prozentpunkte, gedeckelt).
market_factor_max_shift_pct: 4.0

# Wie stark ein stark beschleunigender MW-Trend den Overpay INNERHALB der
# Kategorie nach oben ziehen darf (Prozentpunkte, gedeckelt) -- soll
# aggressiver machen, aber nicht den sportlichen Wert dominieren.
trend_bonus_max_shift_pct: 3.0

# Marktwertklassen (Grenzen, obere Grenze exklusiv) fuer Kalibrierung und
# Aehnlichkeitssuche.
market_value_classes: [3000000, 6000000, 10000000, 15000000, 20000000, 25000000, 30000000]

# Gebotsspanne: die untere Grenze der angezeigten Spanne liegt bei diesem
# Anteil des Overpays ueber Marktwert (die Hauptspalte zeigt immer die obere
# Grenze, siehe Aufgabenstellung).
bid_range_lower_fraction: 0.85
