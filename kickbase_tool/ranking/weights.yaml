# Gewichtung pro Kategorie fuer die beiden Rankings (Aufstellung, Kauf/Verkauf).
#
# Aufstellung: gewichteter Durchschnitt der Rang-Platzierungen (1 = beste
# Auspraegung) ueber alle hier gelisteten Kategorien -- siehe
# ranking/scoring.py::compute_ranking.
#
# Kauf/Verkauf: "kauf" und "verkauf" unten sind ZWEI SEPARATE Teilwertungen,
# die zu einem gemeinsamen Kauf-/Verkaufsrang verschmolzen werden (je 50%,
# siehe ranking/scoring.py::compute_kauf_verkauf_ranking) -- es gibt keinen
# eigenen, sichtbaren Verkaufsrang mehr.
#
# Werte sind RELATIVE Gewichte (werden durch ihre Summe pro Sektion geteilt,
# muessen sich also nicht exakt zu 1.0 aufsummieren) -- nur das Verhaeltnis
# zwischen den Kategorien einer Sektion zaehlt. Frei anpassbar, ohne Code
# aendern zu muessen.
#
# Kategorie-Schluessel:
#   season_avg                 Punkte-Durchschnitt Saison
#   recent_avg                 Punkte-Durchschnitt letzte 5 Spiele (mit Fallback)
#   recent_min_max_avg         Mix aus Minimum und Maximum der letzten 5 Spiele
#   points_per_value           Punkte pro Marktwert
#   goals / assists / clean_sheets
#                               Tore / Vorlagen / Zu-null-Spiele -- je eigene
#                               Kategorie (Verhaeltnis zueinander bewusst
#                               ca. 4.5 : 1.75 : 1, wie zuvor als gebuendelte
#                               Kennzahl)
#   team_form                  Team-Form (letzte 5 Spiele, geglaettet)
#   opponent_form               Gegner-Form (naechster Spieltag)
#   table_position_diff         Tabellenplatz-Differenz zum naechsten Gegner
#                               (Form-Tabelle, nicht die offizielle Bundesliga-Tabelle)
#   team_opponent_form_diff     Differenz zwischen eigener Teamform und Gegnerform
#                               (rohe Punktedifferenz, nicht Rang-basiert)
#   team_momentum               Formanstieg (eigene Formsteigerung)
#   own_venue_rank               Heim-/Auswaertsstaerke des eigenen Teams
#   opponent_venue_rank          Heim-/Auswaertsstaerke des Gegners
#   last5_minutes_ratio          Einsatzminuten der letzten 5 Saison-Spieltage,
#                               als Anteil an den dort maximal moeglichen
#                               Minuten (siehe metrics/calculations.py::
#                               compute_last5_minutes). Gewicht seit der
#                               Nutzer-Vorgabe "Rankings hinsichtlich der
#                               tatsaechlichen Einsatzminuten optimieren"
#                               von 8/6/6 auf 18 (Aufstellung) / 12 (Kauf) /
#                               12 (Verkauf) angehoben -- alle anderen
#                               Kategorien einer Sektion wurden dafuer
#                               proportional (Verhaeltnis zueinander
#                               unveraendert) herunterskaliert.
#   opponent_remaining_schedule_difficulty
#                               Restprogramm-Schwierigkeit der naechsten 5
#                               Gegner (nur Kauf/Verkauf, nicht Aufstellung --
#                               dort deckt table_position_diff bereits den
#                               naechsten einzelnen Gegner ab)
#
# Kennzahl 14 (Verletzt/Gesperrt) ist kein Rang-Kriterium -- betroffene
# Spieler bleiben ganz normal mit echten Werten in beiden Rankings; die
# last5_minutes_ratio-Kategorie oben faengt den Effekt eines aktuellen
# Ausfalls (0 Minuten in den juengsten Spieltagen) bzw. einer vollstaendigen
# Rueckkehr automatisch ueber das rollierende 5-Spieltage-Fenster ab.
# Kennzahl 13 (Startelf-Wahrscheinlichkeit) ist weiterhin nicht Teil der
# Rankings.

